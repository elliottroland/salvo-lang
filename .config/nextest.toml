# cargo-nextest configuration.
#
# nextest is the *full/fresh* runner (user decision 2026-09-12):
# `SALVO_E2E_FRESH=1 cargo nextest run --no-fail-fast` is the pre-commit /
# handover check — cross-binary scheduling wins when every toolchain test
# really runs, it reports per-test durations, and it never hides failures
# behind a first failing binary. Warm inner-loop runs stay on `cargo test`,
# which is ~2× faster there (one process per binary amortizes ~700 spawns).
#
#   SALVO_E2E_FRESH=1 cargo nextest run --no-fail-fast   # the full check
#   cargo nextest run                 # warm, with per-test timings (diagnosis)
#   cargo nextest run -p salvo-cli    # one crate
#   cargo nextest list                # what would run
#
# If a listing dies with `aborted with signal 9 (SIGKILL)` on macOS, that is
# AMFI rejecting a freshly linked binary, not a broken test — see
# COMPLETED.md's gotchas.
[profile.default]
# The compile-and-run data (`salvo-cli`'s `run_data`, one test per area,
# TESTS.md C3) legitimately runs a minute or two fresh: an area compiles
# every program of it on both backends (kotlinc dominated until the tests'
# kotlinc became a warm compiler, 2026-10-29: [test-warm-kotlinc]). The other toolchain
# tests are minutes-long only when something is wrong; a test that hangs
# should still say so rather than stall the run, so the ceiling is 6 minutes.
slow-timeout = { period = "30s", terminate-after = 12 }
# Show a line per test as it finishes, so the timings are the point.
status-level = "pass"
final-status-level = "slow"

[profile.fast]
slow-timeout = "4s"