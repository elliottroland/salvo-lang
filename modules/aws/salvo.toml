[project]
name = "aws"
version = "0.1.0"

[build]
src = "salvo"
# [platform-root] The host glue (`platform/aws/**.kt` and `.rs`, from the
# generator) and the host project every build writes beside it [platform-abi].
platform = "salvo/platform"

# [platform-host-deps] What the generated host glue (`salvo/platform/aws/**`)
# compiles against. Joins a build only when that glue is reached — a program
# that uses only the fakes needs neither SDK.
[rust]
crates = { aws-config = { version = "1", features = ["behavior-version-latest"] }, aws-sdk-s3 = "1", aws-sdk-sqs = "1", bytes = "1", http-body = "1", tokio = { version = "1", features = ["rt-multi-thread", "sync"] } }

[kotlin]
# [host-tool] Resolved by Gradle when the glue is reached. A program building
# over this module names its Gradle (`[kotlin] gradle`, default `gradle` on
# PATH); this one's is the generator's wrapper.
artifacts = ["aws.sdk.kotlin:s3:1.9.11", "aws.sdk.kotlin:sqs:1.9.11"]
gradle = "codegen/gradlew"
