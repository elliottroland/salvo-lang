[package]
name = "salvo-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Name resolution, type checking, and IR for the Salvo compiler"

# There are no doctests, but rustdoc re-runs on every `cargo test` to look
# for them (uncached, ~7s per crate). Delete this if a doc example is ever
# meant to run as a test.
[lib]
doctest = false

[dependencies]
salvo-syntax = { workspace = true }
